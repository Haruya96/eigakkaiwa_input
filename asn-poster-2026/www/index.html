<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#143d47">
  <meta name="description" content="ASN Kidney Week 2026のポスター発表に特化した英語表現100題">
  <title>ASN 2026 Poster Input</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="cards-data.js" defer></script>
  <script src="study-core.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="identity"><span class="seal" aria-hidden="true">ASN<br>26</span><div><p class="eyebrow">KIDNEY WEEK · POSTER PRACTICE</p><h1>Poster English</h1><p class="subtitle">尿酸・蛋白尿・eGFR傾きの発表に向けた100題</p></div></div>
      <div class="progress" aria-live="polite"><strong id="progressText">0 / 100</strong><span>覚えた</span><div class="progress-track"><div id="progressFill"></div></div></div>
    </header>
    <nav class="tabs" aria-label="学習モード">
      <button type="button" class="tab active" id="listenTab" aria-selected="true">▶ 音声で覚える</button>
      <button type="button" class="tab" id="flashTab" aria-selected="false">▣ フラッシュカード</button>
    </nav>
    <main>
      <section class="filters" aria-label="絞り込み">
        <label>カテゴリー<select id="category"><option value="all">すべてのカテゴリー</option></select></label>
        <label>表示<select id="status"><option value="all">すべて</option><option value="unlearned">まだ不安</option><option value="learned">覚えた</option></select></label>
        <label class="search-label">検索<input id="search" type="search" placeholder="英語・日本語で検索" autocomplete="off"></label>
      </section>
      <div class="workbar">
        <span id="position" aria-live="polite">1 / 100</span>
        <button type="button" id="shuffle" class="quiet" aria-pressed="false">シャッフル</button>
        <button type="button" id="previous" aria-label="前のカード">← 前へ</button>
        <button type="button" id="next" aria-label="次のカード">次へ →</button>
      </div>
      <section id="listenPanel" aria-label="音声カード">
        <article class="study-card" id="studyCard">
          <div class="card-meta"><span class="pill" id="listenCategory"></span><span id="listenNumber"></span></div>
          <div class="item"><span class="step">01 · PHRASE</span><p class="expression" id="phrase"></p></div>
          <div class="item"><span class="step">02 · 意味</span><p class="translation" id="japanese"></p></div>
          <div class="item"><span class="step">03 · MY POSTER</span><p class="example" id="example"></p></div>
          <div class="card-footer"><span>英語表現 ×1 → 日本語 ×1 → 例文 ×2</span><button type="button" id="learnButton" class="mark">まだ不安</button></div>
        </article>
        <div class="playbar"><button type="button" id="playOne" class="primary">▶ このカードを再生</button><button type="button" id="playAll">▶ 表示中を連続再生</button><button type="button" id="stop" hidden>■ 停止</button></div>
        <label class="speed-label">読み上げ速度 <span id="rateLabel">0.90×</span><input type="range" id="rate" min="0.65" max="1.15" step="0.05" value="0.90"></label>
        <p class="play-status" id="playStatus" role="status" aria-live="polite">端末の英語・日本語音声を使用します。</p>
      </section>
      <section id="flashPanel" aria-label="フラッシュカード" hidden>
        <div class="flash-options"><label>表面<select id="flashDirection"><option value="ja">日本語 → 英語</option><option value="en">英語 → 日本語</option></select></label><span>カードをタップして答えを表示</span></div>
        <button type="button" class="flash-card" id="flip" aria-label="答えを表示"><span class="card-meta"><span class="pill" id="flashCategory"></span><span id="flashNumber"></span></span><span class="flash-label" id="flashPromptLabel"></span><strong class="flash-prompt" id="flashPrompt"></strong><span class="flash-answer" id="flashAnswer" hidden></span><span class="flash-hint" id="flashHint">タップして答えを見る ↗</span></button>
        <div class="flash-actions"><button type="button" id="flashPlay">▶ 音声を再生</button><button type="button" id="flashLearn" class="mark">まだ不安</button><button type="button" id="flashNext" class="primary">次のカード →</button></div>
      </section>
      <p id="empty" class="empty" hidden>該当するカードがありません。絞り込みを変更してください。</p>
    </main>
    <footer>2026年版ポスター・論文草案に基づく発表練習用例文</footer>
  </div>
</body>
</html>
