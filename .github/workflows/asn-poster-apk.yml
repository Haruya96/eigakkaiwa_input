name: Build ASN poster Android APK

on:
  push:
    paths:
      - 'asn-poster-2026/android/**'
      - 'asn-poster-2026/www/**'
      - 'asn-poster-2026/cards.tsv'
      - 'asn-poster-2026/qa.tsv'
      - '.github/workflows/asn-poster-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate and generate cards
        run: python3 tools/generate_cards.py
        working-directory: asn-poster-2026
      - name: Build debug APK
        run: gradle :app:assembleDebug
        working-directory: asn-poster-2026/android
      - uses: actions/upload-artifact@v4
        with:
          name: ASN2026PosterInput-debug-apk
          path: asn-poster-2026/android/app/build/outputs/apk/debug/app-debug.apk
